name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PHASE7B_REDIS_URL: redis://127.0.0.1:6379/15
      PHASE7B_REDIS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint first-party Python
        run: python -m ruff check .
      - run: python -m pytest -q
      - name: Verify Phase 7B Redis integration
        run: python -m pytest -q tests/test_automation_content_redis.py

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policy_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: automation_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy_test -d automation_policy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://policy_test:isolated_ci_only@127.0.0.1:5432/automation_policy_test
      TEST_POSTGRES_URL: postgresql+asyncpg://policy_test:isolated_ci_only@127.0.0.1:5432/automation_policy_test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify PostgreSQL migration, policy, discovery, Queue, run, and AI budget safety
        run: python -m pytest -q tests/test_automation_policy_postgres.py tests/test_automation_discovery_postgres.py tests/test_automation_queue_postgres.py tests/test_automation_runs_postgres.py tests/test_automation_ai_budget_postgres.py
      - name: Lint PostgreSQL verification
        run: python -m ruff check tests/test_automation_policy_postgres.py tests/test_automation_discovery_postgres.py tests/test_automation_queue_postgres.py tests/test_automation_runs_postgres.py tests/test_automation_ai_budget_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Next.js app
        run: npm run build
      # Specs stub FastAPI at page.route (**/api/v1/**). They never call Postgres,
      # Redis, Telegram, AliExpress, OpenAI, or Gemini. docker compose would not
      # exercise those stubs and would need a second mock layer at the API.
      # Playwright webServer waits until GET /login is reachable (not /health).
      - name: Run Playwright smoke
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
