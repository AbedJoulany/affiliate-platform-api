services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: affiliate-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliate-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-affiliate}:${POSTGRES_PASSWORD:-affiliate_secret}@db:5432/${POSTGRES_DB:-affiliate_db}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: affiliate-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-affiliate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affiliate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-affiliate_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-affiliate} -d ${POSTGRES_DB:-affiliate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: affiliate-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliate-celery-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-affiliate}:${POSTGRES_PASSWORD:-affiliate_secret}@db:5432/${POSTGRES_DB:-affiliate_db}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliate-celery-beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-affiliate}:${POSTGRES_PASSWORD:-affiliate_secret}@db:5432/${POSTGRES_DB:-affiliate_db}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      celery-worker:
        condition: service_started
    volumes:
      - ./app:/app/app
    command: celery -A app.worker.celery_app beat --loglevel=info
    restart: unless-stopped

  # Optional Celery task observability (Phase B Task 3).
  # Start with: docker compose --profile observability up
  flower:
    profiles:
      - observability
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliate-flower
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-flower:replace-with-a-local-flower-password}
    ports:
      # Localhost-only — not bound on 0.0.0.0
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    volumes:
      - ./app:/app/app
    command: >
      celery -A app.worker.celery_app flower
      --address=0.0.0.0
      --port=5555
      --basic-auth=$$FLOWER_BASIC_AUTH
    restart: unless-stopped

volumes:
  postgres_data:
