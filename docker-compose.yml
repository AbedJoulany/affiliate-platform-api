services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliate-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-affiliate}:${POSTGRES_PASSWORD:-affiliate_secret}@db:5432/${POSTGRES_DB:-affiliate_db}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: affiliate-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-affiliate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affiliate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-affiliate_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-affiliate} -d ${POSTGRES_DB:-affiliate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
